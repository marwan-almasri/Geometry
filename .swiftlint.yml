included:
  - Sources

excluded:
  - Tests
  - .build

# Rules enabled beyond the default set
opt_in_rules:
  - empty_count
  - first_where
  - sorted_imports
  - collection_alignment
  - closure_end_indentation
  - explicit_init
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

disabled_rules:
  - trailing_whitespace   # editors handle this

# Line and file length
line_length:
  warning: 120
  error: 160
  ignores_function_declarations: true
  ignores_comments: true

file_length:
  warning: 300
  error: 500

type_body_length:
  warning: 200
  error: 350

function_body_length:
  warning: 50
  error: 80

# Identifier names — allow single-letter math variables and matrix element names
identifier_name:
  min_length:
    warning: 1
  validates_start_with_lowercase: true
  excluded:
    # math variables
    - x
    - y
    - z
    - w
    - r
    - t
    - a
    - b
    - i
    - n
    # rotation matrix elements
    - m11
    - m12
    - m13
    - m21
    - m22
    - m23
    - m31
    - m32
    - m33
    # coordinate system shorthand
    - dx
    - rho
    - phi
    - eps

type_name:
  excluded:
    - T

reporter: xcode
